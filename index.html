<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXEED 現地調査</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<style>
/* Layout: 撮影タブは上にカメラ・下に地図の2段。撮るたびに下の地図に番号と向きが増える。ほかは地図／写真／現場のタブ。 */
:root{
  --bg:#eef1f5; --surface:#ffffff; --fg:#131b26; --muted:#64718a; --line:#dbe1ea;
  --brand:#ffffff; --ink:#2a2f36; --lime:#9fc43a; --lime-soft:#eef5d9;
  --ok:#1f8a5b; --warn:#c7791f; --info:#2f6fd6; --bad:#c43c3c; --chip:#e9edf3;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic","游ゴシック",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabh:58px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f141b; --surface:#1a212b; --fg:#e9eef5; --muted:#97a3b6; --line:#2b3542; --brand:#1a212b; --lime-soft:#2b3620; --chip:#26303c;
  --ok:#3fbf85; --warn:#e0a04f; --info:#6c9af0; --bad:#e36b6b; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit}
img{max-width:100%}
[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.hdr{position:fixed;top:0;left:0;right:0;padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top));background:var(--brand);border-bottom:1px solid var(--line);z-index:1000;display:flex;align-items:center;gap:10px}
.hdr::after{content:"";position:absolute;left:16px;right:16px;top:env(safe-area-inset-top);height:3px;background:var(--lime)}
.nxl{display:block;height:16px;width:auto;overflow:visible;color:var(--fg)}
.logo{display:flex;align-items:center;gap:8px;flex:none}
.logo small{font-weight:500;letter-spacing:.06em;font-size:11px;color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}
.hsite{flex:1;min-width:0;text-align:right;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;cursor:pointer;padding:6px 0}
.hbtn{background:var(--chip);border:0;color:var(--fg);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.view{position:fixed;top:calc(52px + env(safe-area-inset-top));bottom:calc(var(--tabh) + env(safe-area-inset-bottom));left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding-top:14px;padding-bottom:24px}
.wrap{max-width:720px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:1000}
.tabs button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;cursor:pointer}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--fg)}.tabs button.on svg{stroke:var(--lime)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:500;padding:10px 16px;border-radius:10px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--lime);border-color:var(--lime);color:#1c2410;font-weight:700}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
input,textarea,select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}select{height:44px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);letter-spacing:.05em;min-width:0}
.form .wide{grid-column:1/-1}
@media (max-width:420px){.form{grid-template-columns:1fr}}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}.acts .grow{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--fg);white-space:nowrap}
.chip.on{background:var(--ink);color:#f3f5f7;border-color:var(--ink)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.pill.warn{color:var(--warn)}.pill.mut{color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.empty b{display:block;color:var(--fg);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:3000;max-width:92vw;width:max-content;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* 開始・ログイン */
.gate{position:fixed;inset:0;z-index:2000;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.gate .box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;text-align:center}
.gate .nxl{height:34px;margin:0 auto}
.gate .bar{width:56px;height:3px;background:var(--lime);margin:0 auto}
.gate h1{font-size:14px;letter-spacing:.24em;color:var(--muted);font-weight:500;margin:0}
.gate p{font-size:14px;line-height:1.75;color:var(--muted);margin:0;text-align:left}
.gate .err{color:var(--bad)}
.perm{display:flex;flex-direction:column;gap:8px;text-align:left}
.perm .r{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.perm .r b{font-weight:500}
.perm .r span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.perm .r span.ok{color:var(--ok)}.perm .r span.ng{color:var(--bad)}

/* 撮影 */
#v-shoot{display:flex;flex-direction:column;background:#000}
.cam{position:relative;flex:0 0 56%;overflow:hidden;background:#000}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .hud{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.tag{background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:4px 9px;font:500 12px var(--mono);backdrop-filter:blur(4px)}
.tag.ok{box-shadow:inset 3px 0 0 var(--lime)}.tag.ng{box-shadow:inset 3px 0 0 #ff8a7a}
.compass{position:absolute;left:0;right:0;bottom:84px;height:34px;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.compass canvas{width:100%;height:100%}
.compass::after{content:"";position:absolute;left:50%;top:0;width:2px;height:12px;margin-left:-1px;background:var(--lime)}
.shutterrow{position:absolute;left:0;right:0;bottom:12px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25);cursor:pointer;position:relative}
.shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;transition:transform .08s}
.shutter:active::after{transform:scale(.9)}
.shutter:disabled{opacity:.4}
.side{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:11px;background:none;border:0;cursor:pointer}
.side img,.side .ph{width:48px;height:48px;border-radius:9px;object-fit:cover;border:2px solid #fff;background:#333}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.75;transition:none}
.camoff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#d9dee6;font-size:13px;text-align:center;padding:20px;line-height:1.7}
.mini{position:relative;flex:1;min-height:0;background:var(--bg)}
#miniMap,#bigMap{position:absolute;inset:0}
.mapbtns{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mbtn{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:500;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12);white-space:nowrap}
.mbtn.on{background:var(--ink);color:#f3f5f7;border-color:var(--ink)}
.upq{position:absolute;left:10px;top:10px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}

/* 地図のマーカー */
.pm{background:none;border:0}
.pm svg{overflow:visible;display:block}
.me{background:none;border:0}

/* 写真 */
.list{display:flex;flex-direction:column;gap:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;cursor:pointer}
.pcard img{width:96px;height:72px;border-radius:7px;object-fit:cover;background:var(--chip);display:block}
.pcard .tx{min-width:0}
.pcard .t1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pcard .no{font-family:var(--mono);font-weight:500;font-size:13px}
.pcard .tt{font-weight:700;line-height:1.35;word-break:break-word}
.pcard .t2{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.pcard .dir{font-family:var(--mono);color:var(--fg)}
.day{font-size:12px;color:var(--muted);font-family:var(--mono);margin:14px 0 6px;display:flex;justify-content:space-between}
.day:first-child{margin-top:0}
.tools{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.tools input{flex:1;min-width:10em}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.scard.cur{border-color:var(--lime);box-shadow:inset 4px 0 0 var(--lime)}
.scard .n{flex:1;min-width:0;font-weight:700;line-height:1.4}
.scard .n small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.scard b{font-family:var(--mono);font-size:20px}
.scard b small{display:block;font-size:10px;color:var(--muted);font-family:var(--font);font-weight:400;text-align:right}
/* DD */
.ddsum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ddc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px;color:var(--muted)}
.ddc b{display:block;color:var(--fg);font-size:13px;margin-bottom:6px}
.ddc .bar{height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin-bottom:4px}.ddc .bar i{display:block;height:100%;background:var(--lime)}
.ddc em{font-style:normal;color:var(--bad);font-weight:700}
.ddch{font-weight:700;font-size:15px;margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--fg)}
.ddch small{font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
.ddsub{font-size:11px;color:var(--muted);margin:10px 0 4px;letter-spacing:.03em}
.ddrow{display:grid;grid-template-columns:3em 1fr;gap:4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px;cursor:pointer}
.ddid{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.ddtx{min-width:0}.ddtx b{display:block;font-size:14px;line-height:1.4}
.ddtx small{display:block;font-size:12px;color:var(--muted);line-height:1.5}.ddtx small.fd{color:var(--fg)}
.ddst{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.st,.rt,.rk,.pc,.lv,.lv2{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.st-todo{color:var(--muted)}.st-doing{color:var(--info)}.st-tbc{color:var(--warn)}.st-done{color:var(--ok)}
.rt{color:var(--fg)}.pc{color:var(--muted);font-weight:500}.lv{color:var(--bad)}
.rk-高{color:#fff;background:var(--bad);border-color:var(--bad)}.rk-中{color:var(--warn)}.rk-低{color:var(--ok)}
.ddreq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.ddreq p{margin:6px 0 0;line-height:1.6}.ddreq .en{color:var(--muted)}
.lv2{display:inline-block;margin-right:6px;color:var(--muted)}.lv-must{color:var(--bad)}.lv-key{color:var(--warn)}
.ddrisk,.ddph{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tb{width:88px;cursor:pointer;font-size:11px;font-family:var(--mono);color:var(--muted);text-align:center}
.tb img{width:88px;height:66px;object-fit:cover;border-radius:6px;display:block;background:var(--chip)}
.pk{display:grid;grid-template-columns:auto 72px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-family:var(--mono)}
.pk input{width:auto}.pk img{width:72px;height:54px;object-fit:cover;border-radius:6px}.pk small{font-family:var(--font);color:var(--muted)}
.exsec{font-size:11px;color:var(--muted);letter-spacing:.05em;margin-top:6px}
.ddtag{position:absolute;left:10px;top:42px;max-width:calc(100% - 20px);background:rgba(0,0,0,.55);color:#fff;border:1px dashed rgba(255,255,255,.5);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddtag.on{background:var(--lime);color:#1c2410;border:1px solid var(--lime);font-weight:700}
.ddchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ddchips .chip{display:inline-flex;gap:6px;align-items:center}

/* シート */
.sheet{position:fixed;inset:0;z-index:1500;}
#pSheet{z-index:1600}
.sheet{background:var(--bg);display:flex;flex-direction:column}
.sheet .bar{padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top));background:var(--brand);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.sheet .bar b{flex:1;font-size:15px;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .body{flex:1;overflow-y:auto;padding-top:14px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.photo{width:100%;max-height:52vh;object-fit:contain;background:#0b1320;border-radius:12px;display:block}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:12px 0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.facts dt{color:var(--muted);white-space:nowrap}.facts dd{margin:0;font-family:var(--mono);word-break:break-all}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px}.links a{color:var(--info)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--bad);flex-wrap:wrap}
.dlg{position:fixed;inset:0;z-index:2500;background:rgba(10,14,20,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg .box{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow-y:auto}
.dlg .box>b{font-size:16px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;cursor:pointer;align-items:start}
.opt input{width:auto;margin-top:4px}.opt small{grid-column:2;color:var(--muted);font-size:12px;line-height:1.5}
.status{font-size:13px;color:var(--muted);min-height:18px;font-family:var(--mono);word-break:break-all}
.status.err{color:var(--bad)}
.leaflet-container{font-family:var(--font)}
</style></head><body>

<svg width="0" height="0" style="position:absolute"><defs><symbol id="nx" viewBox="0 0 216 40"><g fill="none" stroke="currentColor" stroke-linejoin="bevel"><g stroke-width="4.4"><path d="M2.2 35V5L21.8 35V5"/><path d="M58 7.2H42.2V32.8H58M42.2 20H56.5"/><path d="M74 5L86.6 20L74 35" style="stroke:#9fc43a"/></g><g stroke-width="1.5"><path d="M100.5 5L86.8 20L100.5 35"/><path d="M136 5.8H120.8V34.2H136M120.8 20H135"/><path d="M172 5.8H156.8V34.2H172M156.8 20H171"/><path d="M192.8 5.8H199A14.2 14.2 0 0 1 199 34.2H192.8Z"/></g></g></symbol></defs></svg>

<!-- ログイン・調査開始 -->
<div class="gate" id="gate"><div class="box">
  <svg class="nxl" viewBox="0 0 216 40" style="width:184px" aria-label="NEXEED"><use href="#nx"/></svg>
  <div class="bar"></div><h1>現地調査</h1>
  <div id="gateBody"><p>読み込み中…</p></div>
</div></div>

<div class="hdr gut">
  <div class="logo"><svg class="nxl" viewBox="0 0 216 40" style="width:86px" aria-label="NEXEED"><use href="#nx"/></svg><small>現地調査</small></div>
  <button class="hsite" id="hsite"></button>
  <button class="hbtn" id="expOpen">書き出し</button>
</div>

<!-- 撮影（上：カメラ、下：地図） -->
<div class="view" id="v-shoot">
  <div class="cam" id="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="camoff" id="camOff"><div>カメラを起動しています…</div></div>
    <div class="hud"><span class="tag" id="tPos">位置 —</span><span class="tag" id="tDir">方位 —</span><span class="tag" id="tCnt">0枚</span></div>
    <button class="ddtag" id="ddTagBtn">DD項目：なし</button>
    <div class="compass"><canvas id="cmp" width="720" height="68"></canvas></div>
    <div class="shutterrow">
      <button class="side" id="lastBtn" aria-label="最後に撮った写真"><span class="ph" id="lastPh"></span><span>直前の写真</span></button>
      <button class="shutter" id="shutter" aria-label="撮影"></button>
      <button class="side" id="altBtn"><span class="ph" style="display:flex;align-items:center;justify-content:center;font-size:20px">＋</span><span>標準カメラ等</span></button>
    </div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="mini"><div id="miniMap"></div><div class="upq" id="upq" hidden></div>
    <div class="mapbtns"><button class="mbtn" id="miniFollow">現在地</button><button class="mbtn" id="miniFit">全体</button></div></div>
  <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="filePick" accept="image/*,.heic,.heif" multiple hidden>
</div>

<!-- 地図 -->
<div class="view" id="v-map" hidden>
  <div id="bigMap"></div>
  <div class="mapbtns"><button class="mbtn" id="layerBtn">航空写真</button><button class="mbtn" id="bigFit">全体</button><button class="mbtn" id="bigMe">現在地</button></div>
</div>

<!-- 写真 -->
<div class="view gut pad" id="v-photos" hidden><div class="wrap">
  <div class="tools"><input id="q" placeholder="件名・所見・区分で検索" autocomplete="off"><span class="count" id="pcount"></span></div>
  <div class="chips" id="fcat" style="margin-bottom:12px"></div>
  <div id="plist"></div>

<script type="module">
import { firebaseConfig, allowedDomains } from "./config.js?v=2";
import { DD_CHAPTERS, DD_ITEMS, SEVERITY, LIKELIHOOD, riskLevel } from "./dd-items.js?v=1";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot, query, where, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ls={get(k,d=""){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let toastT;const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),2600)};
const fmtDT=ts=>{if(!ts)return"—";const d=new Date(ts);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtT=ts=>{if(!ts)return"";const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtDay=ts=>{const d=new Date(ts);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${"日月火水木金土"[d.getDay()]}）`};
const fmtYMD=s=>{if(!s)return"";const[y,m,d]=s.split("-");return `${y}/${+m}/${+d}`};
const toLocal=ts=>{const d=new Date(ts||Date.now());return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const isNum=v=>typeof v==="number"&&isFinite(v);
const RAD=Math.PI/180;
const DIR16=["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"];
const norm360=h=>((h%360)+360)%360;
const dirName=h=>DIR16[Math.round(norm360(h)/22.5)%16];
const dirLabel=h=>isNum(h)?`${dirName(h)} ${Math.round(norm360(h))}°`:"方向なし";
const CATS=["全景","敷地・境界","道路・搬入経路","受電・電柱・引込","既存建物","既存設備","地盤・高低差","周辺環境・近隣","支障物・障害物","測定・計測","その他"];
// 磁北→真北（日本の西偏の概算）
const declW=(lat,lng)=>7.6+0.32*(lat-37)-0.10*(lng-138);
const hasPos=p=>isNum(p.lat)&&isNum(p.lng);
const hasDir=p=>isNum(p.heading);

// ---------------- Firebase
let fb=null,auth=null,db=null,me=null;
if(!firebaseConfig){$("gateBody").innerHTML=`<p class="err">Firebaseの設定がまだ入っていません（config.js）。</p>`;throw new Error("no config")}
fb=initializeApp(firebaseConfig);auth=getAuth(fb);
db=initializeFirestore(fb,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const okDomain=email=>allowedDomains.some(d=>String(email||"").toLowerCase().endsWith("@"+d));

function gateLogin(msg){
  $("gate").hidden=false;
  $("gateBody").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px"><p>現場写真を「どこで・いつ・どの方向」を付けて記録し、地図に並べるNEXEED社内のアプリです。会社のGoogleアカウントでログインしてください。</p>
  ${msg?`<p class="err">${esc(msg)}</p>`:""}<button class="btn primary" id="gLogin" style="min-height:52px;font-size:16px">Googleでログイン</button></div>`;
  $("gLogin").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){gateLogin("ログインできませんでした："+(e.code||e.message))}};
}
// ---------------- センサー（位置・方位）
const sens={lat:null,lng:null,acc:null,alt:null,posAt:0,heading:null,headAt:0,headAbs:false,geoErr:"",oriErr:"",watching:false};
let geoWatch=null;
function startGeo(){
  if(!("geolocation" in navigator)){sens.geoErr="この端末では位置情報を使えません";return Promise.resolve(false)}
  return new Promise(res=>{let first=true;
    geoWatch=navigator.geolocation.watchPosition(p=>{sens.lat=p.coords.latitude;sens.lng=p.coords.longitude;sens.acc=p.coords.accuracy;sens.alt=p.coords.altitude;sens.posAt=Date.now();sens.geoErr="";
        if(isNum(p.coords.heading)&&p.coords.speed>1&&!sens.headAbs){} onSensor();if(first){first=false;res(true)}},
      e=>{sens.geoErr=e.code===1?"位置情報が許可されていません":"位置を取得できません";onSensor();if(first){first=false;res(false)}},
      {enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  });
}
let smooth=null;
function onOrient(e){
  let h=null,abs=false;
  if(isNum(e.webkitCompassHeading)){h=e.webkitCompassHeading;abs=true; if(isNum(sens.lat))h=h-declW(sens.lat,sens.lng)}
  else if(e.absolute&&isNum(e.alpha)){h=360-e.alpha;abs=true}
  if(h==null)return;
  const so=(screen.orientation&&isNum(screen.orientation.angle))?screen.orientation.angle:(isNum(window.orientation)?window.orientation:0);
  h=norm360(h+so);
  if(smooth==null)smooth=h;else{let d=((h-smooth+540)%360)-180;smooth=norm360(smooth+d*0.25)}
  sens.heading=smooth;sens.headAbs=abs;sens.headAt=Date.now();onSensorThrottled();
}
async function startOrient(){
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted"){sens.oriErr="方位（コンパス）が許可されていません";return false}}
    if("ondeviceorientationabsolute" in window)addEventListener("deviceorientationabsolute",onOrient);
    addEventListener("deviceorientation",onOrient);return true;
  }catch(e){sens.oriErr="方位（コンパス）を使えません";return false}
}
let sensT=0;const onSensorThrottled=()=>{const n=Date.now();if(n-sensT>120){sensT=n;onSensor()}};
function onSensor(){
  const tp=$("tPos"),td=$("tDir");
  if(isNum(sens.lat)){tp.textContent=`位置 ±${Math.round(sens.acc)}m`;tp.className="tag "+(sens.acc<=15?"ok":"ng")}else{tp.textContent=sens.geoErr||"位置 取得中…";tp.className="tag ng"}
  if(isNum(sens.heading)){td.textContent=`${dirName(sens.heading)} ${Math.round(sens.heading)}°`;td.className="tag ok"}else{td.textContent=sens.oriErr||"方位 —";td.className="tag ng"}
  drawCompassStrip();updateMeMarkers();
}
function drawCompassStrip(){const c=$("cmp");const x=c.getContext("2d"),W=c.width,H=c.height;x.clearRect(0,0,W,H);if(!isNum(sens.heading))return;
  const pxPerDeg=W/120;x.fillStyle="#fff";x.strokeStyle="#fff";x.textAlign="center";x.font=`600 22px "Noto Sans JP",sans-serif`;
  for(let d=Math.floor(sens.heading-70);d<=sens.heading+70;d++){if(d%5)continue;const X=W/2+(d-sens.heading)*pxPerDeg,n=norm360(d);x.lineWidth=n%45===0?3:1.5;x.beginPath();x.moveTo(X,H);x.lineTo(X,H-(n%45===0?22:n%15===0?14:8));x.stroke();
    if(n%45===0){x.fillText(["北","北東","東","南東","南","南西","西","北西"][n/45],X,24)}}}

// ---------------- 状態
let sites=[],photos=[],curSiteId=ls.get("gc.site"),view="shoot",fCat="",unsubP=null;
const curSite=()=>sites.find(s=>s.id===curSiteId)||null;
const sitePhotos=()=>photos.slice().sort((a,b)=>(a.takenAt||0)-(b.takenAt||0)||(a.createdAt||0)-(b.createdAt||0));
const numberOf=p=>sitePhotos().findIndex(x=>x.id===p.id)+1;
const pending=new Map();// id → 状態（アップロード待ち）

// ---------------- 地図
const GSI_STD=()=>L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",{maxNativeZoom:18,maxZoom:21,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'});
const GSI_PHOTO=()=>L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg",{maxNativeZoom:18,maxZoom:21,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル（写真）</a>'});
function makeMap(el,{photo=false}={}){
  const m=L.map(el,{zoomControl:false,attributionControl:true,maxZoom:21}).setView([35.68,139.76],16);
  m._std=GSI_STD();m._ph=GSI_PHOTO();(photo?m._ph:m._std).addTo(m);m._isPhoto=photo;
  m._pl=L.layerGroup().addTo(m);m._meL=L.layerGroup().addTo(m);return m;
}
let mini=null,big=null,follow=true;
function markerSVG(n,p,sel){
  const S=120,c=S/2,R=40;let wedge="",lx=c,ly=c;
  if(hasDir(p)){const half=Math.max(8,Math.min(60,(p.fov||60)/2))*RAD,h=p.heading*RAD;
    const a0=h-half,a1=h+half,P=a=>[c+Math.sin(a)*R,c-Math.cos(a)*R];const [x0,y0]=P(a0),[x1,y1]=P(a1);
    wedge=`<path d="M${c} ${c}L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${sel?"rgba(47,111,214,.3)":"rgba(159,196,58,.35)"}" stroke="${sel?"#2f6fd6":"#6e961a"}" stroke-width="1.5"/>`;
    lx=c+Math.sin(h)*(R+11);ly=c-Math.cos(h)*(R+11);
    wedge+=`<line x1="${c}" y1="${c}" x2="${(c+Math.sin(h)*(R)).toFixed(1)}" y2="${(c-Math.cos(h)*(R)).toFixed(1)}" stroke="${sel?"#2f6fd6":"#6e961a"}" stroke-width="1.5"/>`}
  const r=n>99?13:11.5;
  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">${wedge}<circle cx="${c}" cy="${c}" r="3.5" fill="#2a2f36"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="${r}" fill="${sel?"#2f6fd6":"#2a2f36"}" stroke="#fff" stroke-width="2"/><text x="${lx.toFixed(1)}" y="${(ly+4.2).toFixed(1)}" text-anchor="middle" font-family="Noto Sans JP,sans-serif" font-weight="700" font-size="${n>99?10:12}" fill="#fff">${n}</text></svg>`;
}
let selId=null;
function drawPhotoMarkers(m){
  if(!m)return;m._pl.clearLayers();const list=sitePhotos();
  list.forEach((p,i)=>{if(!hasPos(p))return;const mk=L.marker([p.lat,p.lng],{icon:L.divIcon({className:"pm",html:markerSVG(i+1,p,p.id===selId),iconSize:[120,120],iconAnchor:[60,60]}),keyboard:false});
    mk.on("click",()=>{selId=p.id;drawAllMarkers();openSheet(p.id)});m._pl.addLayer(mk)});
}
function meSVG(){const S=90,c=45;let w="";if(isNum(sens.heading)){const h=sens.heading*RAD,half=30*RAD,R=38,P=a=>[c+Math.sin(a)*R,c-Math.cos(a)*R];const [x0,y0]=P(h-half),[x1,y1]=P(h+half);
  w=`<path d="M${c} ${c}L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="rgba(47,111,214,.25)"/>`}
  return `<svg width="${S}" height="${S}">${w}<circle cx="${c}" cy="${c}" r="8" fill="#2f6fd6" stroke="#fff" stroke-width="3"/></svg>`}
function updateMeMarkers(){
  [mini,big].forEach(m=>{if(!m||!isNum(sens.lat))return;
    if(!m._me){m._acc=L.circle([sens.lat,sens.lng],{radius:sens.acc||10,color:"#2f6fd6",weight:1,fillOpacity:.08,interactive:false}).addTo(m._meL);
      m._me=L.marker([sens.lat,sens.lng],{icon:L.divIcon({className:"me",html:meSVG(),iconSize:[90,90],iconAnchor:[45,45]}),interactive:false,zIndexOffset:1000}).addTo(m._meL)}
    else{m._me.setLatLng([sens.lat,sens.lng]);m._acc.setLatLng([sens.lat,sens.lng]).setRadius(sens.acc||10);const el=m._me.getElement();if(el)el.innerHTML=meSVG()}
  });
  if(mini&&follow&&isNum(sens.lat)&&view==="shoot"){const z=Math.max(mini.getZoom(),18);mini.setView([sens.lat,sens.lng],z,{animate:false})}
}
function fitMap(m){if(!m)return;const pts=sitePhotos().filter(hasPos).map(p=>[p.lat,p.lng]);if(isNum(sens.lat)&&!pts.length)pts.push([sens.lat,sens.lng]);
  if(!pts.length)return;if(pts.length===1)m.setView(pts[0],19);else m.fitBounds(pts,{padding:[50,50],maxZoom:20})}
function drawAllMarkers(){drawPhotoMarkers(mini);drawPhotoMarkers(big)}

// ---------------- 画面切り替え
const VIEWS=["shoot","map","photos","dd","sites"];
function show(v){view=VIEWS.includes(v)?v:"shoot";VIEWS.forEach(x=>$("v-"+x).hidden=x!==view);
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  if(view==="shoot"){startCamera();setTimeout(()=>mini&&mini.invalidateSize(),50)}else stopCamera();
  if(view==="map"){if(!big){big=makeMap($("bigMap"),{photo:true});$("layerBtn").textContent="地図";drawPhotoMarkers(big);updateMeMarkers();setTimeout(()=>{big.invalidateSize();fitMap(big)},60)}else setTimeout(()=>big.invalidateSize(),60)}
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
$("hsite").onclick=()=>show("sites");
$("miniFollow").onclick=()=>{follow=true;$("miniFollow").classList.add("on");updateMeMarkers()};
$("miniFit").onclick=()=>{follow=false;$("miniFollow").classList.remove("on");fitMap(mini)};
$("bigFit").onclick=()=>fitMap(big);
$("bigMe").onclick=()=>{if(isNum(sens.lat))big.setView([sens.lat,sens.lng],19)};
$("layerBtn").onclick=()=>{const m=big;if(m._isPhoto){m.removeLayer(m._ph);m._std.addTo(m);m._isPhoto=false;$("layerBtn").textContent="航空写真"}else{m.removeLayer(m._std);m._ph.addTo(m);m._isPhoto=true;$("layerBtn").textContent="地図"}};

// ---------------- カメラ
let stream=null;
async function startCamera(){
  if(stream||document.hidden)return;
  const off=$("camOff");off.hidden=false;off.innerHTML="<div>カメラを起動しています…</div>";
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:3840},height:{ideal:2160}},audio:false});
    const v=$("video");v.srcObject=stream;await v.play().catch(()=>{});off.hidden=true}
  catch(e){stream=null;off.innerHTML=`<div>カメラを使えません（${esc(e.name||e.message)}）。<br>Safariの「ぁあ」→「Webサイトの設定」でカメラを「許可」にしてください。<br>または右下の「標準カメラ等」から撮影できます。</div><button class="btn small" id="camRetry">もう一度</button>`;
    const r=$("camRetry");if(r)r.onclick=startCamera}
}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopCamera();else if(view==="shoot"&&$("gate").hidden)startCamera()});
const snapSensors=()=>({lat:sens.lat,lng:sens.lng,acc:sens.acc,alt:sens.alt,heading:sens.heading,posOk:isNum(sens.lat)&&Date.now()-sens.posAt<60000,dirOk:isNum(sens.heading)&&Date.now()-sens.headAt<5000});
$("shutter").onclick=async()=>{
  const s=curSite();if(!s){toast("先に現場を選んでください");show("sites");return}
  const v=$("video");if(!stream||!v.videoWidth){toast("カメラが起動していません");return}
  const ss=snapSensors();const at=Date.now();
  $("flash").classList.add("on");setTimeout(()=>$("flash").classList.remove("on"),60);
  const c=document.createElement("canvas");const r=Math.min(1,2400/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*r);c.height=Math.round(v.videoHeight*r);
  c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  const f35=26;const fov=2*Math.atan((c.width>=c.height?36:24)/(2*f35))/RAD;
  savePhoto({canvas:c,takenAt:at,ss,src:"live",fov});
};

$("altNo").onclick=()=>{$("altDlg").hidden=true};

$("altCam").onclick=()=>{$("altDlg").hidden=true;camSnap={ss:snapSensors(),at:Date.now()};$("fileCam").click()};
$("altPick").onclick=()=>{$("altDlg").hidden=true;$("filePick").click()};
$("fileCam").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const snap=camSnap||{ss:snapSensors(),at:Date.now()};camSnap=null;
  try{const {im,u}=await loadImage(f);const c=imgToCanvas(im,2400);URL.revokeObjectURL(u);savePhoto({canvas:c,takenAt:snap.at,ss:snap.ss,src:"cam",fov:60})}catch(err){toast("写真を読み込めません")}};
$("filePick").onchange=async e=>{const fs=[...e.target.files];e.target.value="";let ok=0,np=0;
  for(const f of fs){try{const ex=await readExif(f);const {im,u}=await loadImage(f);const c=imgToCanvas(im,2400);URL.revokeObjectURL(u);
    const lat=isNum(ex.latitude)?ex.latitude:null,lng=isNum(ex.longitude)?ex.longitude:null;let h=null;
    if(isNum(ex.GPSImgDirection)){h=ex.GPSImgDirection;if(String(ex.GPSImgDirectionRef||"T").toUpperCase().startsWith("M"))h=norm360(h-(lat!=null?declW(lat,lng):7.5))}
    const f35=isNum(ex.FocalLengthIn35mmFormat)&&ex.FocalLengthIn35mmFormat>0?ex.FocalLengthIn35mmFormat:26;
    const at=ex.DateTimeOriginal instanceof Date&&!isNaN(ex.DateTimeOriginal)?+ex.DateTimeOriginal:(f.lastModified||Date.now());
    await savePhoto({canvas:c,takenAt:at,ss:{lat,lng,acc:isNum(ex.GPSHPositioningError)?ex.GPSHPositioningError:null,alt:isNum(ex.GPSAltitude)?ex.GPSAltitude:null,heading:h,posOk:lat!=null,dirOk:h!=null},src:"exif",fov:2*Math.atan((c.width>=c.height?36:24)/(2*f35))/RAD});
    ok++;if(lat==null)np++}catch(err){}}
  toast(`${ok}枚を取り込みました${np?`（位置なし ${np}枚）`:""}`)};

function loadImage(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const im=new Image();im.onload=()=>res({im,u});im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("decode"))};im.src=u})}
function imgToCanvas(im,max){const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c}
async function readExif(f){if(!window.exifr)return{};try{return await exifr.parse(f,{tiff:true,exif:true,gps:true,ifd1:false,xmp:false,icc:false,iptc:false,translateValues:false})||{}}catch(e){return{}}}
function canvasJPEG(c,max,q,limit){let m=max,qq=q;
  for(let i=0;i<8;i++){const r=Math.min(1,m/Math.max(c.width,c.height));const t=document.createElement("canvas");t.width=Math.round(c.width*r);t.height=Math.round(c.height*r);t.getContext("2d").drawImage(c,0,0,t.width,t.height);
    const u=t.toDataURL("image/jpeg",qq);if(u.length<limit)return{u,w:t.width,h:t.height};qq=Math.max(.5,qq-.06);m=Math.round(m*.88)}
  throw new Error("画像が大きすぎます")}

// 保存：端末内に先に書き込み、電波が戻れば自動で送信（Firestoreのオフライン保存）
async function savePhoto({canvas,takenAt,ss,src,fov}){
  const s=curSite();const ref=doc(collection(db,"photos"));const id=ref.id;
  const full=canvasJPEG(canvas,1800,.82,900000),th=canvasJPEG(canvas,360,.7,40000);
  const d={siteId:s.id,by:me.uid,byName:me.displayName||me.email,takenAt,createdAt:Date.now(),src,
    lat:ss.posOk?ss.lat:null,lng:ss.posOk?ss.lng:null,acc:ss.posOk&&isNum(ss.acc)?Math.round(ss.acc*10)/10:null,alt:ss.posOk&&isNum(ss.alt)?Math.round(ss.alt*10)/10:null,
    heading:ss.dirOk?Math.round(ss.heading*10)/10:null,posSrc:ss.posOk?(src==="exif"?"exif":"gps"):"",headSrc:ss.dirOk?(src==="exif"?"exif":"compass"):"",
    fov:Math.round(fov||60),w:full.w,h:full.h,cat:"",title:"",memo:"",measure:"",dd:ddTag?[ddTag]:[],thumb:th.u};
  photos.push({...d,id});pending.set(id,1);renderAll();
  $("lastPh").outerHTML=`<img id="lastPh" src="${th.u}" alt="">`;
  try{await setDoc(doc(db,"imgs",id),{data:full.u,siteId:s.id});await setDoc(ref,d);pending.delete(id)}
  catch(e){pending.delete(id);toast("保存できません："+(e.code||e.message))}
  renderAll();
}

function renderDD(){

    return `<div class="ddc"><b>${c.ch}. ${c.ja}</b><div class="bar"><i style="width:${its.length?Math.round(done/its.length*100):0}%"></i></div><span>${done}/${its.length} 確認済${ng?`　<em>要注意 ${ng}</em>`:""}</span></div>`}).join("");

async function buildHTML(s,list,st){const plot=plotPNG(list);let ph="";

<div class="page"><h1>現地調査報告書</h1><table><tr><th>現場名</th><td>${esc(s.name)}</td></tr><tr><th>所在地</th><td>${esc(s.address)||"—"}</td></tr><tr><th>顧客・依頼元</th><td>${esc(s.client)||"—"}</td></tr><tr><th>調査日</th><td>${esc(fmtYMD(s.date))||"—"}</td></tr><tr><th>調査目的</th><td>${esc(s.purpose)||"—"}</td></tr><tr><th>調査者</th><td>${esc(s.team)||"—"}</td></tr><tr><th>写真枚数</th><td>${list.length}枚</td></tr></table>

  info.forEach((r,i)=>{const n=3+i;w1.mergeCells(`A${n}:B${n}`);w1.mergeCells(`C${n}:F${n}`);const a=w1.getCell(`A${n}`),c=w1.getCell(`C${n}`);a.value=r[0];c.value=r[1]||"—";a.font=FB;c.font=F;a.fill=lab;a.alignment=wrap;c.alignment=wrap;["A","B","C","D","E","F"].forEach(k=>w1.getCell(`${k}${n}`).border=box);w1.getRow(n).height=22});
  const pr=3+info.length+1;w1.getCell(`A${pr}`).value="調査位置図";w1.getCell(`A${pr}`).font={...FB,size:11};
  w1.addImage(wb.addImage({base64:plotPNG(list),extension:"png"}),{tl:{col:0,row:pr},ext:{width:690,height:475}});for(let r=pr+1;r<=pr+25;r++)w1.getRow(r).height=15;
  const hr=pr+27;["No.","撮影日時","区分","件名","撮影方向","撮影者"].forEach((h,i)=>{const c=w1.getRow(hr).getCell(i+1);c.value=h;c.font=FB;c.fill=lab;c.border=box;c.alignment={...wrap,horizontal:"center"}});
  list.forEach((p,i)=>{const r=rowOf(p,i),row=w1.getRow(hr+1+i);[r.no,r.at,r.cat,r.title,r.dirTxt,r.by].forEach((v,j)=>{const c=row.getCell(j+1);c.value=v;c.font=F;c.border=box;c.alignment={...wrap,horizontal:j===0?"center":"left"}});row.height=20});
  const w2=wb.addWorksheet("写真台帳",{pageSetup:{paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0}});w2.columns=[{width:58},{width:11},{width:34}];
  w2.headerFooter={oddHeader:`&L${s.name.replace(/&/g,"&&")}&R写真台帳`,oddFooter:"&C&P / &N"};
  const RH=32,ROWS=7,labels=["写真No.","撮影日時","区分","件名","撮影方向","撮影位置","所見"],boxW=58*7+5,boxH=ROWS*RH*96/72;let r0=1;
  for(let i=0;i<list.length;i++){st.textContent=`写真台帳を作成中… ${i+1}/${list.length}`;const p=list[i],r=rowOf(p,i);w2.mergeCells(r0,1,r0+ROWS-1,1);
    for(let k=0;k<ROWS;k++){const row=w2.getRow(r0+k);row.height=RH;const a=row.getCell(2),b=row.getCell(3);a.value=labels[k];a.font=FB;a.fill=lab;a.border=box;a.alignment={...wrap,horizontal:"center"};
      b.value=[r.no,r.at,[r.cat,r.ddTxt?"DD "+r.ddTxt:""].filter(Boolean).join("／")||"—",[r.title,r.measure].filter(Boolean).join("／")||"—",r.dirTxt,r.pos,r.memo||"—"][k];b.font=k===0?{...FB,size:12}:F;b.border=box;b.alignment={wrapText:true,vertical:k===ROWS-1?"top":"middle"};row.getCell(1).border=box}

// ---------------- 開始画面（位置情報・コンパス・カメラの許可）
function gateStart(){
  $("gate").hidden=false;
  $("gateBody").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
  <p>${esc(me.displayName||me.email)} さん。撮影の前に、位置情報・方位（コンパス）・カメラの使用を許可してください。</p>
  <div class="perm"><div class="r"><b>位置情報</b><span id="gP">未確認</span></div><div class="r"><b>方位（コンパス）</b><span id="gO">未確認</span></div><div class="r"><b>カメラ</b><span id="gC">未確認</span></div></div>
  <button class="btn primary" id="gGo" style="min-height:54px;font-size:16px">位置情報をオンにして調査開始</button>
  <p style="font-size:12px">許可を求める画面が出たら「許可」を押してください。前に「許可しない」を選んだ場合は、iPhoneの「設定」→「プライバシーとセキュリティ」→「位置情報サービス」→「Safari Webサイト」を「使用中のみ」にし、Safariのアドレスバーの「ぁあ」→「Webサイトの設定」で位置情報とカメラを「許可」にしてください。</p></div>`;
  $("gGo").onclick=async()=>{$("gGo").disabled=true;
    const o=await startOrient();$("gO").textContent=o?"OK":"使えません";$("gO").className=o?"ok":"ng";
    const g=await startGeo();$("gP").textContent=g?`OK（±${Math.round(sens.acc)}m）`:(sens.geoErr||"使えません");$("gP").className=g?"ok":"ng";
    await startCamera();$("gC").textContent=stream?"OK":"使えません";$("gC").className=stream?"ok":"ng";
    sens.watching=true;setTimeout(()=>{$("gate").hidden=true;if(!mini){mini=makeMap($("miniMap"));drawPhotoMarkers(mini)}mini.invalidateSize();updateMeMarkers();if(!isNum(sens.lat))fitMap(mini);onSensor()},g&&stream?600:1800)};
}

// ---------------- 起動
onAuthStateChanged(auth,u=>{
  if(!u){me=null;stopCamera();gateLogin();return}
  if(!okDomain(u.email)){signOut(auth);gateLogin(`${u.email} ではログインできません。会社のアカウント（${allowedDomains.map(d=>"@"+d).join("、")}）でログインしてください。`);return}
  me=u;$("whoami").textContent=u.email;
  onSnapshot(collection(db,"sites"),sn=>{sites=sn.docs.map(d=>({...d.data(),id:d.id}));
    if(curSiteId&&!sn.metadata.fromCache&&!sites.find(s=>s.id===curSiteId))setSite("");
    if(!curSiteId&&sites.length){const lt=sites.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];setSite(lt.id)}renderAll()},e=>{gateLogin("データを読み込めません（"+e.code+"）。管理者に連絡してください。")});
  subscribePhotos();subscribeDD();renderAll();
  if(!sens.watching)gateStart();else $("gate").hidden=true;
});
